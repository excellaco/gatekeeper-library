apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredannotations
  annotations:
    metadata.gatekeeper.sh/title: "Required Annotations"
    metadata.gatekeeper.sh/version: 1.0.1
    description: >-
      Requires resources to contain specified annotations, with values matching
      provided regular expressions.
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredAnnotations
      validation:
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
            exemptedServiceAccounts:
              type: array
              description: >-
                A list of service accounts that are exempt from this constraint.
              items:
                type: string
            annotations:
              type: array
              description: >-
                A list of annotations and values the object must specify.
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: >-
                      The required annotation.
                  value:
                    type: string
                    description: >-
                      If specified, the exact value the annotation must have.
                  allowedRegex:
                    type: string
                    description: >-
                      If specified, a regular expression the annotation's value
                      must match. The value must contain at least one match for
                      the regular expression.
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredannotations

        # DEBUGGING SECTION - Always log the user (simplified version)
        warn[{"msg": msg}] {
            # Simplified rule that will always trigger
            msg := sprintf("User: %v - Resource: %v - Kind: %v", [
                input.review.userInfo.username,
                input.review.object.metadata.name,
                input.review.kind.kind
            ])
        }

        # VIOLATION RULES FOR DENY ENFORCEMENT
        violation[{"msg": msg, "details": {"missing_annotations": missing}}] {
            # Skip enforcement for exempted service accounts
            not is_exempted_user
            
            # Get the list of required annotations from parameters
            required := {annotation | annotation := input.parameters.annotations[_].key}
            
            # Get provided annotations - handle case where annotations don't exist
            annotations := object.get(input.review.object.metadata, "annotations", {})
            provided := {annotation | annotations[annotation]}
            
            # Calculate missing annotations
            missing := required - provided
            count(missing) > 0
            msg := sprintf("you must provide annotation(s): %v", [missing])
        }

        violation[{"msg": msg}] {
            # Skip enforcement for exempted service accounts
            not is_exempted_user
            
            # Check if annotation values match required values when specified
            annotations := input.review.object.metadata.annotations
            
            value := annotations[key]
            expected := input.parameters.annotations[_]
            expected.key == key
            expected.value != ""
            value != expected.value
            
            msg := sprintf("Annotation <%v: %v> does not match required value: %v", [key, value, expected.value])
        }

        violation[{"msg": msg}] {
            # Skip enforcement for exempted service accounts
            not is_exempted_user
            
            # Check if annotation values match required regex when specified
            annotations := input.review.object.metadata.annotations
            
            value := annotations[key]
            expected := input.parameters.annotations[_]
            expected.key == key
            expected.allowedRegex != ""
            not regex.match(expected.allowedRegex, value)
            
            msg := sprintf("Annotation <%v: %v> does not satisfy allowed regex: %v", [key, value, expected.allowedRegex])
        }

        # Helper to check if user is exempted from enforcement
        is_exempted_user {
            sa := input.parameters.exemptedServiceAccounts[_]
            input.review.userInfo.username == sa
        }