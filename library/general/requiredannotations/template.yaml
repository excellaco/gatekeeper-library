apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredannotations
  annotations:
    metadata.gatekeeper.sh/title: "Required Annotations"
    metadata.gatekeeper.sh/version: 1.0.1
    description: >-
      Requires resources to contain specified annotations, with values matching
      provided regular expressions.
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredAnnotations
      validation:
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
            annotations:
              type: array
              description: >-
                A list of annotations and values the object must specify.
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: >-
                      The required annotation.
                  allowedRegex:
                    type: string
                    description: >-
                      If specified, a regular expression the annotation's value
                      must match. The value must contain at least one match for
                      the regular expression.
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
          package k8srequiredannotations

          violation[{"msg": msg, "details": {"missing_annotations": missing, "resource_kind": kind, "resource_name": name, "namespace": namespace}}] {
                  # Extract resource information for better context in messages
                  obj := input.review.object
                  name := obj.metadata.name
                  namespace := obj.metadata.namespace
                  kind := input.review.kind.kind
                  
                  # Check for missing annotations
                  provided := {annotation | obj.metadata.annotations[annotation]}
                  required := {annotation | annotation := input.parameters.annotations[_].key}
                  missing := required - provided
                  count(missing) > 0
                  
                  # More informative message that includes resource details
                  msg := sprintf("Resource %v '%v' in namespace '%v' is missing required annotation(s): %v", [kind, name, namespace, missing])
              }

              violation[{"msg": msg, "details": {"invalid_annotation": key, "resource_kind": kind, "resource_name": name, "namespace": namespace}}] {
                  # Extract resource information for better context in messages
                  obj := input.review.object
                  name := obj.metadata.name
                  namespace := obj.metadata.namespace
                  kind := input.review.kind.kind
                  
                  # Check regex validation
                  value := obj.metadata.annotations[key]
                  expected := input.parameters.annotations[_]
                  expected.key == key
                  expected.allowedRegex != ""
                  not regex.match(expected.allowedRegex, value)
                  
                  # More informative message that includes resource details and expected format
                  msg := sprintf("Resource %v '%v' in namespace '%v' has annotation '%v' with value '%v' that does not match required format: %v", [kind, name, namespace, key, value, expected.allowedRegex])
              }