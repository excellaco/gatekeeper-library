# 1. Constraint Template
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8suniqueroute
  annotations:
    metadata.gatekeeper.sh/title: "Unique Route Hostname"
    metadata.gatekeeper.sh/version: 1.0.0
    metadata.gatekeeper.sh/requires-sync-data: |
      "[
        [
          {
            \"groups\":[\"route.openshift.io\"],
            \"versions\": [\"v1\"],
            \"kinds\": [\"Route\"]
          }
        ]
      ]"
    description: >-
      Requires OpenShift Routes to have unique hostnames across all namespaces.
      Having duplicate hostnames can lead to unpredictable routing behavior and
      potential security issues.
spec:
  crd:
    spec:
      names:
        kind: K8sUniqueRoute
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8suniqueroute

        make_apiversion(kind) = apiVersion {
          g := kind.group
          v := kind.version
          g != ""
          apiVersion = sprintf("%v/%v", [g, v])
        }

        make_apiversion(kind) = apiVersion {
          kind.group == ""
          apiVersion = kind.version
        }

        identical(obj, review) {
          obj.metadata.namespace == review.namespace
          obj.metadata.name == review.name
          obj.kind == review.kind.kind
          obj.apiVersion == make_apiversion(review.kind)
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Route"
          input.review.kind.group == "route.openshift.io"
          input_hostname := input.review.object.spec.host
          other := data.inventory.namespace[ns][otherapiversion]["Route"][name]
          startswith(otherapiversion, "route.openshift.io")
          other.spec.host == input_hostname
          not identical(other, input.review)
          msg := sprintf("Route hostname '%v' is already in use by route '%v' in namespace '%v'", [input_hostname, name, ns])
        }